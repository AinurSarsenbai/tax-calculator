
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
spec:
  workspaces:
    - name: source
  params:
    - name: args
      type: array
      default:
        - install
  steps:
    - name: npm
      image: node:20
      workingDir: $(workspaces.source.path)
      command:
        - npm
      args:
        - $(params.args[*])
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: jasmine
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm test
